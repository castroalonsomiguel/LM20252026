const GL = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  E:'111100110100111', F:'111100110100100', G:'011100101101011', H:'101101111101101',
  I:'111010010010111', J:'001001001101010', K:'101101110101101', L:'100100100100111',
  M:'101111111101101', N:'110101101101101', O:'010101101101010', P:'110101110100100',
  Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101',
  Y:'101101010010010', Z:'111001010100111',
  '0':'111101101101111', '1':'010110010010111', '2':'110001010100111', '3':'110001010001110',
  '4':'101101111001001', '5':'111100110001110', '6':'011100111101111', '7':'111001010010010',
  '8':'111101111101111', '9':'111101111001110',
  '!':'010010010000010', '?':'111001010000010', '.':'000000000000010', ',':'000000000010100',
  "'":'010010000000000', ':':'000010000010000', '-':'000000111000000', '¡':'010000010010010',
  '¿':'010000010100111', '*':'000101010101000', '/':'001001010100100', '>':'100010001010100',
  '<':'001010100010001', '+':'000010111010000', '(':'010100100100010', ')':'010001001001010',
  '=':'000111000111000', '[':'110100100100110', ']':'011001001001011', '#':'101111101111101', '%':'101001010100101'
};
function norm(s) { return String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function txt(s, x, y, col, sc = 1) {
  s = norm(s); g.fillStyle = col;
  let cx = Math.round(x); y = Math.round(y);
  for (const ch of s) {
    const gl = GL[ch];
    if (gl) for (let i = 0; i < 15; i++) if (gl[i] === '1') g.fillRect(cx + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc);
    cx += 4 * sc;
  }
}
function tw(s, sc = 1) { return norm(s).length * 4 * sc - sc; }
function txtC(s, cx, y, col, sc = 1) { txt(s, cx - tw(s, sc) / 2, y, col, sc); }
function txtO(s, x, y, col, oc, sc = 1) {
  for (const [a, b] of [[-1,0],[1,0],[0,-1],[0,1]]) txt(s, x + a, y + b, oc, sc);
  txt(s, x, y, col, sc);
}
function wrap(s, maxW, sc = 1) {
  const words = norm(s).split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (tw(t, sc) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function pat(rows, x, y, map) {
  x = Math.round(x); y = Math.round(y);
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const c = map[r[i]]; if (c) { g.fillStyle = c; g.fillRect(x + i, y + j, 1, 1); } } });
}
function lerpC(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (sh) => { const u = (pa >> sh) & 255, v = (pb >> sh) & 255; return (u + (v - u) * t) | 0; };
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const fmt = n => { n = Math.round(n * 10) / 10; return Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.', ','); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, d = 0.1, type = 'square', vol = 0.05, f2) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, a.currentTime);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + d);
  gn.gain.setValueAtTime(vol, a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
  o.connect(gn).connect(a.destination);
  o.start(); o.stop(a.currentTime + d);
}
function jingle(notes, step = 0.09) { notes.forEach((f, i) => setTimeout(() => beep(f, step * 1.3, 'square', 0.04), i * step * 1000)); }
function speak(text, pitch = 1, rate = 1.05) {
  if (muted || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.pitch = pitch; u.rate = rate;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function drawChar(c, x, y, s, face, o = {}) {
  const X = Math.round(x), Y = Math.round(y);
  const R = (dx, dy, w, h, col) => {
    if (face < 0) dx = 12 - dx - w;
    g.fillStyle = col;
    g.fillRect(X + Math.round(dx * s), Y + Math.round(dy * s), w * s, h * s);
  };

  const skin = c.skin, pants = c.pants, shoe = '#1b1b1b', shirt = c.shirt;
  if (fr === 4) {

  R(3,2,6,7,skin);
  R(4,5,1,1,'#1a1a1a'); R(7,5,1,1,'#1a1a1a');
  R(5,7,2,1,'#8a4b3a');

}
function smoke(R, sx, sy, t, rgb) {

    case 'horns': R(3,1,6,2,h); R(1,0,2,1,'#eeeeee'); R(0,-1,1,1,'#eeeeee'); R(9,0,2,1,'#eeeeee'); R(11,-1,1,1,'#eeeeee'); break;

function drawPenguin(R, fr, t, o) {
  const B = '#161616', Wt = '#f4f4f4', O = '#f39c12', AF = '#2a1a0e', AF2 = '#5a3a20';
  const lu = fr === 1 ? 1 : 0, ru = fr === 3 ? 1 : 0;

const tmpC = document.createElement('canvas'); tmpC.width = 200; tmpC.height = 200; const tg = tmpC.getContext('2d');
const silC = document.createElement('canvas'); silC.width = 200; silC.height = 200; const sg = silC.getContext('2d');
function drawCharO(c, x, y, s, face, o = {}) {
  const ox = 10 * s, oy = 12 * s, w = 46 * s, h = 38 * s;
  const fx = face < 0 ? 14 * s : 0;   // hueco extra para la espada
  tg.clearRect(0, 0, w, h);
  const old = g; g = tg; drawChar(c, ox + fx, oy, s, face, o); g = old;
  sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, w, h); sg.drawImage(tmpC, 0, 0);
  sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#0b0b12'; sg.fillRect(0, 0, w, h);
  sg.globalCompositeOperation = 'source-over';
  const X = Math.round(x) - ox - fx, Y = Math.round(y) - oy;
  for (const [a, b] of [[-1,0],[1,0],[0,-1],[0,1]]) g.drawImage(silC, 0, 0, w, h, X + a, Y + b, w, h);
  g.drawImage(tmpC, 0, 0, w, h, X, Y, w, h);
  if (o.flash) {
    sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#ffffff'; sg.fillRect(0, 0, w, h);
    sg.globalCompositeOperation = 'source-over';
    g.drawImage(silC, 0, 0, w, h, X, Y, w, h);
  }
}

const SAVE_KEY = 'nebrija_partida_v3';

      heartsT:Object.fromEntries(Object.entries(HEARTS).map(([k, v]) => [k, v.map(c => c.taken ? 1 : 0)])),
    }));
  } catch (e) {}
}
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return false;
    charIdx = d.charIdx; sel = charIdx; coins = d.coins; xp = d.xp; level = d.level; drinks = d.drinks || 0;
    Object.assign(mstate, d.mstate); Object.assign(inv, d.inv); Object.assign(up, d.up);
    latas = d.latas; apuntesOk = d.apuntesOk; boss1Done = d.boss1Done; boss2Done = d.boss2Done; stUnlocked = d.stUnlocked;
    d.stDone.forEach((v, i) => stDone[i] = v); d.stKills.forEach((v, i) => stKills[i] = v);
    p.bonusHearts = d.bonusHearts; p.hearts = Math.max(1, d.hearts);
    ITEMS.forEach((it, i) => it.taken = !!d.items[i]);
    for (const k in d.coinsT) if (COINS[k]) COINS[k].forEach((c, i) => c.taken = !!d.coinsT[k][i]);
    for (const k in d.heartsT) if (HEARTS[k]) HEARTS[k].forEach((c, i) => c.taken = !!d.heartsT[k][i]);
    return true;
  } catch (e) { return false; }
}

function loadScene(name, atDoor, x) {
  scene = name;
  const d = atDoor ? DOORS[atDoor] : null;
  p.x = d ? d.x - 6 : (x != null ? x : (SC[name].spawnX || 20));
  p.y = GROUND; p.vy = 0; p.onGround = true; p.jumps = 0; p.alpha = 1; p.kb = 0; p.boost = 0; p.dashT = 0;
  if (d) d.open = 1;
  particles = []; shots = []; pshots = []; npcSay = null; boss = null;
  if (SC[name].name) banner = { text: SC[name].name, t: 2.5 };
  if (name === 'clase') pending = { t: 0.8, fn: () => carmeloTalk(true) };
  if (name === 'bar') greeted = false;
  if (name === 'director') pending = { t: 0.6, fn: directorTalk };
  if (name === 'disco' && !boss1Done) { boss = makeBoss('gorila'); pending = { t: 0.6, fn: bossIntro }; }
  if (name === 'metro' && !boss2Done) { boss = makeBoss('revisor'); pending = { t: 0.6, fn: bossIntro }; }
  if (SC[name].arena != null && !stDone[SC[name].arena]) { boss = makeBoss(STATIONS[SC[name].arena].boss); pending = { t: 0.6, fn: bossIntro }; }
  if (name === 'outside') lastZone = zoneAt(p.x);
  camX = 0; updateCam();
}
function tryDoor(d) {
  const lock = d.lock && d.lock();
  if (lock) { p.say = { text: lock, t: 3 }; beep(150, 0.15, 'square', 0.04); return; }
  let to = d.to, at = d.at;
  if (d.drunk && drunk()) { to = 'director'; at = null; }
  trans = { d, phase:'open', t:0, to, at, x:d.toX };
  if (d.kind === 'slide') beep(300, 0.35, 'triangle', 0.05, 600);
  else { beep(120, 0.12, 'square', 0.05); setTimeout(() => beep(90, 0.15, 'square', 0.04), 110); }
}
function goTo(to, at, x, after) { trans = { d:null, phase:'in', t:0, to, at, x, after }; }
function updateTrans(dt) {
  const d = trans.d;
  if (trans.phase === 'open') {
    d.open = Math.min(1, d.open + dt * 2.5);
    if (d.open >= 1) trans.phase = 'walk';
  } else if (trans.phase === 'walk') {
    const tx = d.x - 6, dx = tx - p.x;
    if (Math.abs(dx) < 1) { p.x = tx; trans.phase = 'in'; trans.t = 0; }
    else { p.face = Math.sign(dx); p.x += Math.sign(dx) * Math.min(Math.abs(dx), 50 * dt); p.moving = true; }
  } else if (trans.phase === 'in') {
    trans.t += dt;
    if (d) p.alpha = Math.max(0, 1 - trans.t * 3);
    fade = Math.min(1, trans.t * 2.5);
    if (fade >= 1) {
      if (d) d.open = 0;
      loadScene(trans.to, trans.at, trans.x);
      if (trans.after) trans.after();
      trans.phase = 'out';
      save();
    }
  } else if (trans.phase === 'out') {
    fade -= dt * 2.5;
    if (fade <= 0) { fade = 0; trans = null; }
  }
}

function makeBoss(kind) {
  const d = BOSSDEF[kind];
  return { kind, def:d, spec:NPC[kind], s:d.s, x:W - 40 - 12 * d.s, y:GROUND, vx:0, vy:0, face:-1, hp:d.hp, maxHp:d.hp,
           state:'idle', t:0, inv:0, active:false, dead:false, thrown:false };
}
function bossIntro() {
  if (!boss) return;
  dialog = { name: boss.spec.name, text: boss.def.intro, col:'#ff3ea5', shown:0, t:0, onClose:() => { if (boss) { boss.active = true; boss.state = 'walk'; boss.t = 0; } } };
  speak(boss.def.lines[0], 0.6, 1.1);
}
function bossBox(b) { const s = b.s; return { x:b.x + 2 * s, y:b.y - 20 * s, w:8 * s, h:20 * s }; }
function bossSay(b) { b.say = { text:b.def.lines[Math.floor(Math.random() * b.def.lines.length)], t:1.1 }; }
function pickMove(b) {
  const m = b.def.moves[Math.floor(Math.random() * b.def.moves.length)];
  b.t = 0; b.thrown = false;
  const pc = p.x + 6, bc = b.x + 6 * b.s;
  b.face = pc < bc ? -1 : 1;
  if (m === 'charge') { b.state = 'tell'; b.vx = 0; bossSay(b); beep(100, 0.3, 'sawtooth', 0.05); }
  else if (m === 'hop') {
    b.state = 'hop'; b.vy = -240;
    const target = clamp(30 + Math.random() * (W - 60 - 12 * b.s), 24, W - 24 - 12 * b.s);
    b.vx = (target - b.x) / 0.8;
  }
  else if (m === 'throw') { b.state = 'throw'; b.vx = 0; bossSay(b); }
  else if (m === 'rain') { b.state = 'rain'; b.vx = 0; bossSay(b); }
}
function bossShot(x, y, vx, vy) { if (boss.def.shot) shots.push({ x, y, vx, vy, kind:boss.def.shot, t:0 }); }
function updateBoss(dt) {
  const b = boss;
  if (!b || b.dead) return;
  b.t += dt; if (b.inv > 0) b.inv -= dt;
  b.vy += 620 * dt; b.y += b.vy * dt;
  if (b.y >= GROUND) { b.y = GROUND; b.vy = 0; }
  const pc = p.x + 6, bc = b.x + 6 * b.s, sp = b.def.spd, right = W - 24 - 12 * b.s;
  if (b.say) { b.say.t -= dt; if (b.say.t <= 0) b.say = null; }
  if (!b.active) return;
  switch (b.state) {
    case 'walk':
      b.face = pc < bc ? -1 : 1; b.vx = b.face * 30 * sp;
      if (b.t > b.def.wait / sp) pickMove(b);
      break;
    case 'tell':
      b.vx = 0;
      if (b.t > 0.7 / Math.sqrt(sp)) { b.state = 'charge'; b.t = 0; b.vx = b.face * 170 * sp; }
      break;
    case 'charge':
      if ((b.vx < 0 && b.x <= 24) || (b.vx > 0 && b.x >= right)) { b.state = 'stun'; b.t = 0; b.vx = 0; shake = 0.3; beep(80, 0.3, 'square', 0.06); }
      break;
    case 'stun':
      b.vx = 0;
      if (b.t > 1.6 / Math.sqrt(sp)) { b.state = 'walk'; b.t = 0; }
      break;
    case 'hop':
      if (b.y >= GROUND && b.t > 0.2) {
        b.vx = 0; b.state = 'walk'; b.t = 0; b.face = pc < bc ? -1 : 1;
        const n = 2 + Math.round(sp * 1.5);
        for (let i = 0; i < n; i++) bossShot(bc, b.y - 14 * b.s, b.face * (40 + i * 30), -150 - i * 15);
        if (b.def.shot) beep(700, 0.06, 'square', 0.04);
        if (b.s >= 3) shake = 0.25;
      }
      break;
    case 'throw':
      if (b.t > 0.4 && !b.thrown) {
        b.thrown = true;
        const n = 2 + Math.round(sp);
        for (let i = 0; i < n; i++) { const dx = (pc - bc) * (0.8 + i * 0.2); bossShot(bc, b.y - 16 * b.s, dx / 1.3, -200); }
        beep(600, 0.08, 'square', 0.04);
      }
      if (b.t > 1.0) { b.state = 'walk'; b.t = 0; }
      break;
    case 'rain':
      if (b.t > 0.3 && !b.thrown) {
        b.thrown = true;
        const n = 3 + Math.round(sp * 2);
        for (let i = 0; i < n; i++) shots.push({ x:20 + Math.random() * 280, y:-10 - Math.random() * 60, vx:0, vy:0, kind:b.def.shot || 'multa', t:0, rain:1 });
        beep(900, 0.2, 'triangle', 0.04, 300);
      }
      if (b.t > 1.2) { b.state = 'walk'; b.t = 0; }
      break;
  }
  b.x = clamp(b.x + b.vx * dt, 24, right);

  const bb = bossBox(b), pb = pbox();
  if (overlap(pb, bb) && !trans) {
    if (p.vy > 0 && p.prevFeet <= bb.y + 6) {
      p.vy = -260; p.jumps = 1; p.lastJump = performance.now();
      if (b.inv <= 0) damageBoss(stompDmg(), 0.7);
    } else if (b.state !== 'stun') hurt(bc, b.def.dmg || 1);
  }
}
function damageBoss(d, inv) {
  const b = boss;
  if (!b || b.dead || !b.active || b.inv > 0) return;
  b.hp = Math.max(0, b.hp - d); b.inv = inv; shake = 0.2;
  beep(500, 0.1, 'square', 0.06, 200);
  const bb = bossBox(b);
  floaters.push({ x:bb.x + bb.w / 2, y:bb.y - 6, text:'-' + fmt(d), col:'#ff7a7a', t:0.8 });
  for (let i = 0; i < 8; i++) particles.push({ x:bb.x + bb.w / 2, y:bb.y, vx:(Math.random() - 0.5) * 120, vy:-Math.random() * 80, life:0.5, col:'#ffd23f' });

function updateShots(dt) {
  for (const s of shots) {
    s.t += dt; s.vy += (s.rain ? 220 : 300) * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (overlap(pbox(), { x:s.x - 3, y:s.y - 3, w:6, h:6 })) { s.dead = true; hurt(s.x, 1); }
    if (s.y > GROUND) s.dead = true;
  }
  shots = shots.filter(s => !s.dead);
  for (const s of pshots) {
    s.vy += 300 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += dt * 20;
    const sb = { x:s.x - 3, y:s.y - 3, w:6, h:6 };
    for (const e of ENEMIES[scene] || []) if (!s.dead && !e.gone && !e.fly && overlap(sb, enemyBox(e))) { killEnemy(e); s.dead = true; }
    if (!s.dead && boss && !boss.dead && boss.active && overlap(sb, bossBox(boss))) { damageBoss(throwDmg(), 0.2); s.dead = true; }
    if (!s.dead && s.y > GROUND) { s.dead = true; for (let i = 0; i < 5; i++) particles.push({ x:s.x, y:GROUND - 1, vx:(Math.random() - 0.5) * 60, vy:-Math.random() * 50, life:0.4, col:'#6b3410' }); beep(1200, 0.05, 'square', 0.03); }
  }
  pshots = pshots.filter(s => !s.dead && s.x > camX - 40 && s.x < camX + W + 40);
}

function pbox() { return { x:p.x + 2, y:p.y - 20, w:8, h:20 }; }
const keyL = () => keys.arrowleft || keys.a;
const keyR = () => keys.arrowright || keys.d;
function jump() {
  const now = performance.now();

  if (p.onGround || p.jumps === 0) {
    p.vy = -215; p.jumps = 1; p.lastJump = now; p.onGround = false;
    beep(400, 0.12, 'square', 0.04, 700);
  } else if (p.jumps < maxJ && now - p.lastJump < 1000) {
    p.vy = -215; p.jumps++; p.lastJump = now;
    if (up.propulsado) { const dir = keyL() ? -1 : keyR() ? 1 : p.face; p.boost = dir * 170; p.face = dir; }
    beep(650 + p.jumps * 100, 0.14, 'square', 0.04, 1100 + p.jumps * 100);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2;
      particles.push({ x:p.x + 6, y:p.y, vx:Math.cos(a) * 40, vy:Math.sin(a) * 20, life:0.4, col: up.propulsado ? '#7fe0ff' : '#ffffff' });
    }
  }
}
function attack() {
  if (cd.atk > 0) return;
  cd.atk = 0.32; p.atkT = 0.15;
  const range = [11, 17, 21][weapon()];
  const hb = { x: p.face > 0 ? p.x + 10 : p.x + 2 - range, y:p.y - 19, w:range, h:16 };
  beep(weapon() ? 900 : 300, 0.06, weapon() ? 'triangle' : 'square', 0.04, weapon() ? 1500 : 150);
  for (const e of ENEMIES[scene] || []) if (!e.gone && !e.fly && overlap(hb, enemyBox(e))) killEnemy(e);
  if (boss && !boss.dead && boss.active && overlap(hb, bossBox(boss))) damageBoss(meleeDmg(), 0.3);
}
function doDash() {

  if (!p.onGround) p.airDash = false;
  p.dashT = 0.18; p.dashDir = keyL() ? -1 : keyR() ? 1 : p.face; p.face = p.dashDir; cd.dash = 0.9;

}
function doShield() {

}
function doThrow() {

function hurt(fromX, dmg = 1) {

  p.kb = (p.x + 6 < fromX ? -1 : 1) * 150; p.vy = -150; p.onGround = false;

function faint() {
  p.hearts = 0;
  const lost = Math.min(coins, 1);

  let to = 'outside', at = null, x = 20, msg = 'TE HAS DESMAYADO... -' + fmt(lost) + ' MONEDAS';

  else if (SC[scene].arena != null) { to = 'st' + SC[scene].arena; at = 'boss' + SC[scene].arena; msg = '¡DERROTA! MEJORA EN LA TIENDA Y VUELVE'; }
  else if (SC[scene].station != null) { to = scene; x = 30; }

function updatePlayer(dt, locked) {
  const solids = SOLIDS[scene];
  let mv = 0;
  if (!locked) { if (keyL()) mv -= 1; if (keyR()) mv += 1; }
  if (mv && p.dashT <= 0) p.face = mv;
  const speed = 75 * (cur().spd || 1) * (up.zapas ? 1.25 : 1);
  let vx = mv * speed + p.kb + p.boost;
  if (drunkAmt > 0 && !locked) vx += Math.sin(time * 2.1) * 32 * drunkAmt + Math.sin(time * 5.3) * 10 * drunkAmt;
  if (p.dashT > 0) { p.dashT -= dt; vx = p.dashDir * 280; p.vy = 0; if (Math.random() < 0.6) particles.push({ x:p.x + 6, y:p.y - 4 - Math.random() * 14, vx:-p.dashDir * 30, vy:0, life:0.25, col:'#7fe0ff' }); }
  p.kb -= p.kb * Math.min(1, dt * 6);
  p.boost -= p.boost * Math.min(1, dt * 2.2);
  if (Math.abs(p.boost) < 2) p.boost = 0;
  p.x += vx * dt;
  p.x = clamp(p.x, SC[scene].minX != null ? SC[scene].minX : 4, SC[scene].w - 16);
  let b = pbox();
  for (const s of solids) if (!s.plat && overlap(b, s)) {
    if (vx > 0) p.x = s.x - 10; else if (vx < 0) p.x = s.x + s.w - 2;
    p.boost = 0; b = pbox();
  }
  p.prevFeet = p.y;
  const wasAir = !p.onGround;
  if (p.dashT <= 0) p.vy += 620 * dt;
  p.y += p.vy * dt;
  if (p.dropT > 0) p.dropT -= dt;
  let landed = false;
  if (p.y >= GROUND) { p.y = GROUND; landed = true; }
  for (const s of solids) {
    if (s.plat) {
      if (p.dropT <= 0 && p.vy >= 0 && p.prevFeet <= s.y + 0.5 && p.y >= s.y && p.x + 2 < s.x + s.w && p.x + 10 > s.x) { p.y = s.y; landed = true; }
    } else if (overlap(pbox(), s)) {
      if (p.vy >= 0 && p.prevFeet <= s.y + 0.5) { p.y = s.y; landed = true; }
      else if (p.vy < 0) { p.y = s.y + s.h + 20; p.vy = 0; }
    }
  }
  if (landed) {
    p.vy = 0; p.onGround = true; p.jumps = 0; p.airDash = true;
    if (wasAir) { p.boost *= 0.3; for (let i = 0; i < 4; i++) particles.push({ x:p.x + 6, y:p.y, vx:(i - 1.5) * 20, vy:-10, life:0.25, col:'#d8d8d8' }); }
  } else p.onGround = false;
  p.moving = mv !== 0 && p.onGround;
}
function onPlatform() {

function zoneAt(x) { let z = 0; ZONES.forEach(([zx], i) => { if (x >= zx) z = i; }); return z; }

}
function killEnemy(e) {

  }

function updateEnemies(dt) {

function update(dt) {
  time += dt;
  if (mode === 'menu') { tickAnim(menuAnim, dt); return; }
  if (victory) { victory.t += dt; return; }

  tickAnim(p, dt);
  if (dialog) {
    const len = norm(dialog.text).length;
    const before = Math.floor(dialog.shown);
    dialog.shown = Math.min(len, dialog.shown + dt * 50);
    dialog.t += dt;
    if (Math.floor(dialog.shown) !== before && before % 3 === 0 && dialog.shown < len)
      beep(dialog.npc === 'carmelo' || dialog.npc === 'director' ? 220 : 520, 0.03, 'square', 0.02);
  }
  const paused = !!(dialog || barShop || store || metroMap || logOpen);
  if (!paused) {
    updatePlayer(dt, !!trans);
    updateEnemies(dt);
    updateBoss(dt);
    updateShots(dt);
    if (!trans) updatePickups(dt);
    if (p.inv > 0) p.inv -= dt;
    if (p.shieldT > 0) p.shieldT -= dt;
    if (p.atkT > 0) p.atkT -= dt;
    for (const k in cd) if (cd[k] > 0) cd[k] -= dt;
  }
  if (trans) updateTrans(dt);
  for (const k in DOORS) if (!trans || DOORS[k] !== trans.d) DOORS[k].open = Math.max(0, DOORS[k].open - dt * 1.5);

  if (pending) { pending.t -= dt; if (pending.t <= 0 && !trans) { const f = pending.fn; pending = null; f(); } }
  if (npcSay) { npcSay.t -= dt; if (npcSay.t <= 0) npcSay = null; }
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (shake > 0) shake -= dt;
  if (hintT > 0) hintT -= dt;
  saveT += dt; if (saveT > 5) { saveT = 0; save(); }

  if (alcohol > 0) alcohol = Math.max(0, alcohol - dt / 40);
  const target = drunk() ? Math.min(1, 0.55 + (alcohol - 4) * 0.15) : 0;
  drunkAmt += (target - drunkAmt) * Math.min(1, dt * 1.5);
  if (drunkAmt < 0.01) drunkAmt = 0;
  if (drunk() && !paused) {
    p.hicT -= dt;
    if (p.hicT <= 0) {
      p.hicT = 3 + Math.random() * 4;
      if (!p.say) p.say = { text:'¡HIP!', t:0.9 };
      if (p.onGround) { p.vy = -90; p.onGround = false; }
      beep(500, 0.08, 'triangle', 0.05, 900);
    }
  }
  if (scene === 'outside' && !trans) {
    const z = zoneAt(p.x);
    if (z !== lastZone) { lastZone = z; banner = { text: ZONES[z][1], t:2.2 }; }
  }
  if (scene === 'bar' && cur().id === 'lucas' && !greeted && !trans && p.x + 6 > 150) {
    greeted = true;
    npcSay = { text:'¡QUE TAL LUCAS VASQUES!', t:3 };
    speak('¡Qué tal Lucas Vasques!', 1, 1.05);
  }
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  for (const f of floaters) { f.y -= 18 * dt; f.t -= dt; }
  floaters = floaters.filter(f => f.t > 0);
  updateCam();
}

  g.fillStyle = d.col; g.fillRect(x + 6, y - 9, nw, 9);
  txt(d.name, x + 10, y - 7, '#000000');
  let left = Math.floor(d.shown);
  lines.forEach((l, i) => {
    if (left <= 0) return;
    txt(l.slice(0, left), x + 7, y + 6 + i * 8, '#ffffff');
    left -= l.length + 1;
  });
  if (d.shown >= norm(d.text).length && Math.floor(time * 3) % 2) txt('E >', x + w - 16, y + h - 8, d.col);
}

  opts.forEach((o, i) => {
    const yy = y + 22 + i * 10, on = i === barShop.sel;
    if (on) { g.fillStyle = '#3a2216'; g.fillRect(x + 3, yy - 2, w - 6, 9); txt('>', x + 6, yy, '#ffd23f'); }
    txt(o.label, x + 14, yy, on ? '#ffd23f' : '#ffffff');
    if (o.price != null) { const pr = o.price ? fmt(o.price) + ' MON' : 'GRATIS'; txt(pr, x + w - 8 - tw(pr), yy, o.price > coins ? '#ff7a7a' : '#2ecc71'); }
  });
  txt('TIENES: ' + fmt(coins) + ' MONEDAS', x + 6, y + h - 8, '#ffd23f');

}
function drawStore() {
  const x = 8, y = 18, w = 304, h = 150;
  g.fillStyle = '#2ecc71'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = '#0f1a14'; g.fillRect(x, y, w, h);
  g.fillStyle = '#2ecc71'; g.fillRect(x + 6, y - 9, tw('LA TIENDA DE PACO') + 8, 9); txt('LA TIENDA DE PACO', x + 10, y - 7, '#000');
  ['MEJORAS', 'HABILIDADES'].forEach((t, i) => {
    const tx = x + 6 + i * 70, on = store.tab === i;
    g.fillStyle = on ? '#2ecc71' : '#1e3a2a'; g.fillRect(tx, y + 5, 64, 10);
    txtC(t, tx + 32, y + 8, on ? '#000' : '#9fd0b0');
  });
  txt('<A  D>', x + 150, y + 8, '#5a8a6a');
  txt(fmt(coins) + ' MON', x + w - 8 - tw(fmt(coins) + ' MON'), y + 8, '#ffd23f');
  const list = storeList();
  list.forEach((it, i) => {
    const yy = y + 21 + i * 10, on = i === store.sel, own = storeOwned(it);
    if (on) { g.fillStyle = '#1e3a2a'; g.fillRect(x + 3, yy - 2, w - 6, 9); txt('>', x + 6, yy, '#ffd23f'); }
    let label = it.name;
    if (it.max) label += ' (' + up[it.id] + '/' + it.max + ')';
    txt(label, x + 14, yy, own ? '#5a8a6a' : on ? '#ffd23f' : '#ffffff');
    const pr = own ? 'COMPRADO' : fmt(it.price) + ' MON';
    txt(pr, x + w - 8 - tw(pr), yy, own ? '#2ecc71' : it.price > coins ? '#ff7a7a' : '#ffd23f');
  });
  const it = list[store.sel];
  g.fillStyle = '#1e3a2a'; g.fillRect(x + 4, y + h - 40, w - 8, 36);
  if (it) wrap(it.desc, w - 18).slice(0, 2).forEach((l, i) => txt(l, x + 9, y + h - 36 + i * 7, '#ffffff'));
  wrap(store.msg, w - 18).slice(0, 1).forEach(l => txt(l, x + 9, y + h - 20, store.col));
  txt('W/S: ELEGIR   E: COMPRAR   ESC: SALIR', x + 9, y + h - 11, '#5a8a6a');
}
function drawMetroMap() {
  const x = 30, y = 20, w = 260, h = 140;
  g.fillStyle = '#1f3a93'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = '#ffffff'; g.fillRect(x, y, w, h);
  pat(METRO_LOGO, x + 6, y + 4, { '#':'#d0021b' });
  txt('PLANO DEL METRO - LINEA NEBRIJA', x + 16, y + 6, '#1f3a93');
  g.fillStyle = '#e84393'; g.fillRect(x + 18, y + 22, 3, 8 * 13 - 4);
  STATIONS.forEach((st, i) => {
    const yy = y + 20 + i * 13, on = i === metroMap.sel, open = i < stUnlocked;
    g.fillStyle = stDone[i] ? '#2ecc71' : open ? '#ffffff' : '#bbbbbb'; g.fillRect(x + 15, yy, 9, 9);
    g.fillStyle = '#1f3a93'; g.fillRect(x + 15, yy, 9, 1); g.fillRect(x + 15, yy + 8, 9, 1); g.fillRect(x + 15, yy, 1, 9); g.fillRect(x + 23, yy, 1, 9);
    if (on) { g.fillStyle = '#fff3a0'; g.fillRect(x + 28, yy, w - 34, 9); txt('>', x + 30, yy + 2, '#d0021b'); }
    txt(st.name, x + 36, yy + 2, open ? '#1f3a93' : '#aaaaaa');
    const tag = stDone[i] ? 'SUPERADA' : open ? 'ABIERTA' : 'BLOQUEADA';
    txt(tag, x + w - 8 - tw(tag), yy + 2, stDone[i] ? '#2ecc71' : open ? '#d0021b' : '#aaaaaa');
  });
  txt('W/S: ELEGIR  E: VIAJAR  ESC: CERRAR', x + 30, y + h - 9, '#636e72');
}
function drawLog() {
  const x = 10, y = 10, w = 300, h = 162;
  g.fillStyle = '#ffd23f'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = '#0e0b2a'; g.fillRect(x, y, w, h);
  txtC('MISIONES', 160, y + 4, '#ffd23f', 2);
  let yy = y + 18;
  const stNow = SC[scene].station != null ? SC[scene].station : SC[scene].arena;
  const ids = stNow != null ? ['st' + stNow + 'a', 'st' + stNow + 'b'] : Object.keys(MISSIONS).filter(k => !MISSIONS[k].scene);
  if (stNow != null) { txt('PARADA: ' + STATIONS[stNow].name, x + 6, yy, '#7fe0ff'); yy += 10; }
  for (const id of ids) {
    const m = MISSIONS[id], st = mstate[id], me = id === cur().id;
    const mark = me ? '[-]' : st === 2 ? '[X]' : st === 1 ? '[>]' : '[ ]';
    const col = me ? '#555577' : st === 2 ? '#2ecc71' : st === 1 ? '#ffffff' : '#8a8ab0';
    txt(mark + ' ' + m.who.split(' ').slice(-1)[0] + ': ' + (st === 0 && !me ? '???' : m.title), x + 6, yy, col);
    const rw = me ? 'ERES TU' : '+' + fmt(m.reward);
    txt(rw, x + w - 6 - tw(rw), yy, me ? '#555577' : '#ffd23f');
    yy += 9;
  }
  yy += 3;
  if (stNow != null) {
    txt((stDone[stNow] ? '[X]' : '[ ]') + ' JEFE: ' + NPC[STATIONS[stNow].boss].name, x + 6, yy, stDone[stNow] ? '#2ecc71' : '#ff9ad5');
  } else {
    txt((boss1Done ? '[X]' : '[ ]') + ' JEFE: EL GORILA (LA PIXELERA)', x + 6, yy, boss1Done ? '#2ecc71' : '#ff9ad5'); yy += 9;
    txt((boss2Done ? '[X]' : '[ ]') + ' JEFE: EL REVISOR (METRO)', x + 6, yy, boss2Done ? '#2ecc71' : '#ff9ad5');
  }
  txt('NIVEL ' + level + '   XP ' + xp + '/' + xpNeed() + '   PARADAS ' + stDone.filter(Boolean).length + '/8', x + 6, y + h - 18, '#7fe0ff');
  txt('LATAS ' + latas + '/5   L: CERRAR', x + 6, y + h - 9, '#9fa0d0');
}
function drawVictory() {
  g.fillStyle = 'rgba(0,0,0,0.8)'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) { g.fillStyle = ['#ff3ea5', '#3ef0ff', '#ffd23f', '#2ecc71'][i % 4]; g.fillRect((i * 37 + victory.t * 30 * (1 + i % 3)) % W, (i * 23 + victory.t * 40 * (1 + i % 2)) % H, 2, 2); }
  txtO('¡HAS GANADO!', 160 - tw('¡HAS GANADO!', 3) / 2, 26, '#ffd23f', '#d0021b', 3);
  txtC('HAS DERROTADO A MEGA CARMELO Y RECORRIDO TODO EL METRO', 160, 50, '#ffffff');
  txtC('ERES LA LEYENDA DE LA NEBRIJA', 160, 60, '#ffd23f');
  const done = Object.values(mstate).filter(v => v === 2).length;
  txtC('NIVEL: ' + level, 160, 78, '#7fe0ff');
  txtC('MISIONES: ' + done + '/' + Object.keys(MISSIONS).length, 160, 87, '#3ef0ff');
  txtC('MONEDAS: ' + fmt(coins), 160, 96, '#ffd23f');
  txtC('BEBIDAS: ' + drinks, 160, 105, '#ff9ad5');
  drawCharO(cur(), 154, 118, 1, 1, { t: time, moving: true });
  if (Math.floor(time * 2) % 2) txtC('PULSA E PARA SEGUIR JUGANDO', 160, 160, '#ffffff');
}

function render() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (mode === 'menu') drawMenu(); else drawGame();
  out.imageSmoothingEnabled = false;
  out.fillStyle = '#000'; out.fillRect(0, 0, cv.width, cv.height);
  if (mode === 'game' && drunkAmt > 0) {
    const a = drunkAmt;
    for (let y = 0; y < H; y += 2) {
      const off = Math.round(Math.sin(time * 3 + y * 0.06) * 2.5 * a * K);
      out.drawImage(buf, 0, y, W, 2, off, y * K, W * K, 2 * K);
    }
    out.globalAlpha = 0.3 * a;
    out.drawImage(buf, Math.round(Math.sin(time * 1.7) * 6 * a * K), 0, W * K, H * K);
    out.globalAlpha = 1;
    out.fillStyle = `rgba(255,140,60,${(0.08 * a).toFixed(3)})`; out.fillRect(0, 0, cv.width, cv.height);
  } else out.drawImage(buf, 0, 0, W * K, H * K);
}

// ============================================================
//  INPUT  (WASD o flechas)
// ============================================================
const keys = {};
const isUp = k => k === 'arrowup' || k === 'w';
const isDown = k => k === 'arrowdown' || k === 's';
const isLeft = k => k === 'arrowleft' || k === 'a';
const isRight = k => k === 'arrowright' || k === 'd';
const isOk = k => k === 'e' || k === 'enter' || k === ' ';
addEventListener('keydown', e => {
  ac();
  const k = e.key.toLowerCase();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'tab'].includes(k)) e.preventDefault();
  keys[k] = true;
  if (e.repeat) return;

  if (k === 'm') { muted = !muted; if (muted && window.speechSynthesis) speechSynthesis.cancel(); return; }
  if (mode === 'menu') {
    if (isRight(k)) setSel(sel + 1);
    else if (isLeft(k)) setSel(sel - 1);
    else if (isDown(k) || isUp(k)) setSel(sel + 5);
    else if (k === 'enter' || k === ' ') startGame(true);
    else if (k === 'n' && !started) { try { localStorage.removeItem(SAVE_KEY); } catch (er) {} hasSave = false; startGame(false); }
    else if (k === 'escape' && started) mode = 'game';
    return;
  }
  if (victory) { if (isOk(k) && victory.t > 1) victory = null; return; }
  if (dialog) {
    if (isOk(k)) {
      const len = norm(dialog.text).length;
      if (dialog.shown < len) dialog.shown = len;
      else { const cb = dialog.onClose; dialog = null; if (cb) cb(); }
    }
    return;
  }
  if (barShop) {
    const n = barOptions().length;
    if (isUp(k)) { barShop.sel = (barShop.sel + n - 1) % n; beep(600, 0.03); }
    else if (isDown(k)) { barShop.sel = (barShop.sel + 1) % n; beep(600, 0.03); }
    else if (isOk(k)) barChoose();
    else if (k === 'escape') barShop = null;
    else if (k === 'q') { barShop = null; drink(); }
    return;
  }
  if (store) {
    const n = storeList().length;
    if (isUp(k)) { store.sel = (store.sel + n - 1) % n; beep(600, 0.03); }
    else if (isDown(k)) { store.sel = (store.sel + 1) % n; beep(600, 0.03); }
    else if (isLeft(k) || isRight(k) || k === 'tab') { store.tab = 1 - store.tab; store.sel = 0; beep(700, 0.03); }
    else if (isOk(k)) storeBuy();
    else if (k === 'escape') store = null;
    return;
  }
  if (metroMap) {
    if (isUp(k)) { metroMap.sel = (metroMap.sel + STATIONS.length - 1) % STATIONS.length; beep(600, 0.03); }
    else if (isDown(k)) { metroMap.sel = (metroMap.sel + 1) % STATIONS.length; beep(600, 0.03); }
    else if (isOk(k)) {
      if (metroMap.sel < stUnlocked) { const i = metroMap.sel; metroMap = null; jingle([523, 659, 784]); goTo('st' + i, null, 40); }
      else { beep(150, 0.15); banner = { text:'BLOQUEADA: DERROTA AL JEFE DE LA PARADA ANTERIOR', t:2.5 }; }
    } else if (k === 'escape') metroMap = null;
    return;
  }
  if (k === 'l' || k === 'tab') { logOpen = !logOpen; beep(700, 0.04); return; }
  if (logOpen) { if (k === 'escape') logOpen = false; return; }
  if (k === 'escape') { openMenu(); return; }
  if (trans) return;
  if (k === ' ' || isUp(k)) jump();
  else if (isDown(k)) { if (p.onGround && onPlatform()) { p.dropT = 0.25; p.onGround = false; p.y += 1; } }
  else if (k === 'e') { const it = nearest(); if (it) it.act(); }
  else if (k === 'q') drink();
  else if (k === 'f') attack();
  else if (k === 'r') doDash();
  else if (k === 'c') doShield();
  else if (k === 'x') doThrow();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('click', e => {
  ac();
  if (mode !== 'menu') return;
  const b = cv.getBoundingClientRect();
  const mx = (e.clientX - b.left) / b.width * W, my = (e.clientY - b.top) / b.height * H;
  CHARS.forEach((c, i) => {
    const r = cardRect(i);
    if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) { if (i === sel) startGame(true); else setSel(i); }
  });
});

// ============================================================
//  BUCLE PRINCIPAL
// ============================================================
setSel(0, false);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
