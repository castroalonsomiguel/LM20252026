// ============================================================
//  PANTALLA: el juego se dibuja en un buffer de 320x180 y se
//  escala con un factor ENTERO de pixeles reales (nitido).
// ============================================================
const W = 320, H = 180;
const cv = document.getElementById('c');
const out = cv.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
let g = buf.getContext('2d');
let K = 1;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  K = Math.max(1, Math.floor(Math.min(innerWidth * dpr / W, innerHeight * dpr / H)));
  cv.width = W * K; cv.height = H * K;
  cv.style.width = (W * K / dpr) + 'px';
  cv.style.height = (H * K / dpr) + 'px';
  out.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);
resize();
window.focus();
cv.addEventListener('pointerdown', () => { cv.focus(); window.focus(); });

const GL = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110',
  E:'111100110100111', F:'111100110100100', G:'011100101101011', H:'101101111101101',
  I:'111010010010111', J:'001001001101010', K:'101101110101101', L:'100100100100111',
  M:'101111111101101', N:'110101101101101', O:'010101101101010', P:'110101110100100',
  Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101',
  Y:'101101010010010', Z:'111001010100111',
  '0':'111101101101111', '1':'010110010010111', '2':'110001010100111', '3':'110001010001110',
  '4':'101101111001001', '5':'111100110001110', '6':'011100111101111', '7':'111001010010010',
  '8':'111101111101111', '9':'111101111001110',
  '!':'010010010000010', '?':'111001010000010', '.':'000000000000010', ',':'000000000010100',
  "'":'010010000000000', ':':'000010000010000', '-':'000000111000000', '¡':'010000010010010',
  '¿':'010000010100111', '*':'000101010101000', '/':'001001010100100', '>':'100010001010100',
  '<':'001010100010001', '+':'000010111010000', '(':'010100100100010', ')':'010001001001010',
  '=':'000111000111000', '[':'110100100100110', ']':'011001001001011', '#':'101111101111101'
};
function norm(s) { return String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function txt(s, x, y, col, sc = 1) {
  s = norm(s); g.fillStyle = col;
  let cx = Math.round(x); y = Math.round(y);
  for (const ch of s) {
    const gl = GL[ch];
    if (gl) for (let i = 0; i < 15; i++) if (gl[i] === '1') g.fillRect(cx + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc);
    cx += 4 * sc;
  }
}
function tw(s, sc = 1) { return norm(s).length * 4 * sc - sc; }
function txtC(s, cx, y, col, sc = 1) { txt(s, cx - tw(s, sc) / 2, y, col, sc); }
function txtO(s, x, y, col, oc, sc = 1) {
  for (const [a, b] of [[-1,0],[1,0],[0,-1],[0,1]]) txt(s, x + a, y + b, oc, sc);
  txt(s, x, y, col, sc);
}
function wrap(s, maxW, sc = 1) {
  const words = norm(s).split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (tw(t, sc) > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function pat(rows, x, y, map) {
  x = Math.round(x); y = Math.round(y);
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const c = map[r[i]]; if (c) { g.fillStyle = c; g.fillRect(x + i, y + j, 1, 1); } } });
}
function lerpC(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (sh) => { const u = (pa >> sh) & 255, v = (pb >> sh) & 255; return (u + (v - u) * t) | 0; };
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.', ',');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f, d = 0.1, type = 'square', vol = 0.05, f2) {
  if (muted) return;
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), gn = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, a.currentTime);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + d);
  gn.gain.setValueAtTime(vol, a.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
  o.connect(gn).connect(a.destination);
  o.start(); o.stop(a.currentTime + d);
}
function jingle(notes, step = 0.09) { notes.forEach((f, i) => setTimeout(() => beep(f, step * 1.3, 'square', 0.04), i * step * 1000)); }
function speak(text, pitch = 1, rate = 1.05) {
  if (muted || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.pitch = pitch; u.rate = rate;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function drawChar(c, x, y, s, face, o = {}) {
  const X = Math.round(x), Y = Math.round(y);
  const R = (dx, dy, w, h, col) => {
    if (face < 0) dx = 12 - dx - w;
    g.fillStyle = col;
    g.fillRect(X + Math.round(dx * s), Y + Math.round(dy * s), w * s, h * s);
  };
  const t = o.t || 0;
  const fr = o.air ? 4 : (o.moving ? (Math.floor(t * 10) % 4) : 0);
  if (c.penguin) { drawPenguin(R, fr, t, o); return; }

  const skin = c.skin, pants = c.pants, shoe = '#1b1b1b', shirt = c.shirt;
  if (fr === 4) {
    R(3,16,2,4,pants); R(7,16,2,4,pants); R(3,20,3,1,shoe); R(7,20,3,1,shoe);
  } else {
    const lu = fr === 1 ? 1 : 0, ru = fr === 3 ? 1 : 0;
    R(3,16,2,5-lu,pants); R(3,21-lu,3,1,shoe);
    R(7,16,2,5-ru,pants); R(7,21-ru,3,1,shoe);
  }
  R(2,9,8,7,shirt);
  if (c.belly) { R(1,11,10,5,shirt); R(2,15,8,1,pants); R(5,12,1,1,c.bellyCol || '#6c3483'); }
  if (c.vest) { R(2,9,2,7,c.vest); R(8,9,2,7,c.vest); }
  if (c.tie) R(5,9,2,5,c.tie);
  if (c.bow) R(5,9,2,1,c.bow);

  const comb = o.comb;
  if (comb) { R(0,4,2,6,shirt); R(0,2,2,2,skin); }
  else if (c.shortSleeve) { R(0,9,2,2,shirt); R(0,11,2,4,skin); }
  else { R(0,9,2,5,shirt); R(0,14,2,1,skin); }
  if (!comb) drawHeld(R, o.held);

  R(3,2,6,7,skin);
  R(4,5,1,1,'#1a1a1a'); R(7,5,1,1,'#1a1a1a');
  R(5,7,2,1,'#8a4b3a');
  if (c.beard) { R(3,7,6,2,c.hair); R(3,6,1,1,c.hair); R(8,6,1,1,c.hair); R(5,7,2,1,'#5a2a1a'); }
  if (c.mustache) R(4,6,4,1,c.mustache);
  drawHair(c, R);
  if (c.glasses) { R(3,4,3,3,'#222'); R(6,4,3,3,'#222'); R(4,5,1,1,'#bfe9ff'); R(7,5,1,1,'#bfe9ff'); }
  if (c.shades) { R(3,4,6,2,'#050505'); R(4,4,1,1,'#5a5a5a'); R(7,4,1,1,'#5a5a5a'); }
  if (c.brows) { R(3,3,2,1,'#333'); R(7,3,2,1,'#333'); }
  if (c.earpiece) { R(9,4,1,4,'#dddddd'); }
  if (o.dizzy) { R(4,5,1,1,'#fff'); R(7,5,1,1,'#fff'); }

  if (comb) {
    R(10,8,2,5,shirt); R(10,7,2,1,skin);
    R(11,1,4,6,'#7f8c8d'); R(12,2,2,4,'#cfefff'); R(12,2,1,1,'#ffffff'); R(12,7,1,2,'#7f8c8d');
    const off = Math.round((Math.sin(t * 14) + 1) * 2);
    R(1 + off,-1,5,1,'#222'); R(1 + off,0,1,1,'#222'); R(3 + off,0,1,1,'#222'); R(5 + off,0,1,1,'#222');
    if (Math.floor(t * 6) % 2) R(10,-2,1,1,'#ffffff');
  } else if (c.shortSleeve) {
    R(10,9,2,2,shirt); R(10,11,2,4,skin);
    if (c.tattoo) { R(10,11,1,1,'#1d3fa0'); R(11,12,1,1,'#1d3fa0'); R(10,13,1,1,'#1d3fa0'); R(11,13,1,1,'#b0233a'); }
  } else {
    R(10,9,2,5,shirt); R(10,14,2,1,skin);
  }
  if (!comb && c.item === 'vape') {
    R(12,11,1,4,'#4a4a4a'); R(12,10,1,1,'#33ccff');
    smoke(R, 12, 9, t, '220,230,240');
  }
  if (!comb && c.item === 'porro') {
    R(12,13,3,1,'#f2f2f2');
    R(15,13,1,1, Math.floor(t * 5) % 2 ? '#ff7a1a' : '#ffb347');
    smoke(R, 15, 12, t, '200,200,200');
  }
}
function smoke(R, sx, sy, t, rgb) {
  for (let i = 0; i < 3; i++) {
    const ph = ((t * 0.7) + i / 3) % 1;
    const sz = ph > 0.5 ? 2 : 1;
    R(sx + ph * 3 + Math.sin(ph * 6 + i), sy - ph * 9, sz, sz, `rgba(${rgb},${((1 - ph) * 0.8).toFixed(2)})`);
  }
}
function drawHeld(R, held) {
  if (held === 'quinto') { R(-1,9,1,2,'#5c2a0a'); R(-2,11,3,4,'#6b3410'); R(-2,12,3,2,'#d4001a'); R(-1,8,1,1,'#ffd700'); }
  if (held === 'copa')   { R(-2,10,3,5,'#bfe9ff'); R(-2,12,3,3,'#e6a03a'); R(-1,12,1,1,'#ffffff'); R(0,8,1,3,'#ff3ea5'); }
}
function drawHair(c, R) {
  const h = c.hair;
  switch (c.style) {
    case 'buzz':  R(3,1,6,2,h); break;
    case 'short': R(3,1,6,2,h); R(2,2,1,3,h); R(9,2,1,2,h); break;
    case 'curly': R(2,0,8,3,h); R(2,3,1,2,h); R(9,3,1,2,h);
      R(3,0,1,1,'#3a3a3a'); R(6,1,1,1,'#3a3a3a'); R(8,0,1,1,'#3a3a3a'); R(4,2,1,1,'#3a3a3a'); break;
    case 'book':  R(2,0,8,2,h); R(2,2,2,4,h); R(8,2,2,4,h); R(4,2,1,1,h); R(7,2,1,1,h); R(6,0,1,2,'#d9a77a'); break;
    case 'bangs': R(2,0,8,2,h); R(3,2,6,2,h); R(2,2,1,5,h); R(9,2,1,5,h); break;
    case 'quiff': R(3,1,6,2,h); R(3,-1,7,2,h); R(5,-2,5,1,h); R(2,2,1,2,h); R(9,2,1,2,h); R(6,-1,2,1,'#6b4a33'); break;
    case 'bald':  R(2,3,1,3,h); R(9,3,1,3,h); R(3,2,1,1,h); R(8,2,1,1,h); R(5,2,2,1,'#f6d2b0'); break;
    case 'side':  R(3,1,6,2,h); R(2,2,1,3,h); R(9,2,1,3,h); R(4,1,1,1,'#ffffff'); break;
    case 'wild':  R(2,0,8,2,h); R(1,-1,1,2,h); R(4,-2,1,2,h); R(7,-2,1,2,h); R(10,-1,1,2,h); R(2,2,1,3,h); R(9,2,1,3,h); break;
    case 'cap':   R(2,2,1,2,h); R(9,2,1,2,h); R(2,0,8,2,c.cap); R(3,-1,6,1,c.cap); R(8,2,4,1,'#0d1b4a'); R(5,0,2,1,'#ffd23f'); break;
  }
}
function drawPenguin(R, fr, t, o) {
  const B = '#161616', Wt = '#f4f4f4', O = '#f39c12', AF = '#2a1a0e', AF2 = '#5a3a20';
  const lu = fr === 1 ? 1 : 0, ru = fr === 3 ? 1 : 0;
  R(2,21-lu,3,1,O); R(7,21-ru,3,1,O);
  R(2,3,8,18,B); R(3,2,6,1,B);
  R(4,9,4,11,Wt); R(3,11,6,7,Wt);
  const fl = (o.air || o.moving) ? (Math.floor(t * 12) % 2) : 0;
  R(0,9-fl,2,7,B); R(10,9-fl,2,7,B);
  R(4,3,4,4,Wt); R(4,4,1,1,'#000'); R(7,4,1,1,'#000');
  R(6,6,4,1,O); R(6,7,3,1,'#d35400');
  R(1,-6,10,2,AF); R(0,-4,12,5,AF); R(1,1,2,2,AF); R(9,1,2,2,AF);
  [[1,-5],[4,-6],[7,-5],[10,-4],[2,-2],[5,-3],[8,-2],[3,0],[9,0],[6,-1],[0,-1],[11,-2]]
    .forEach(([a, b]) => R(a, b, 1, 1, AF2));
  drawHeld(R, o.held);
}

const tmpC = document.createElement('canvas'); tmpC.width = 160; tmpC.height = 160; const tg = tmpC.getContext('2d');
const silC = document.createElement('canvas'); silC.width = 160; silC.height = 160; const sg = silC.getContext('2d');
function drawCharO(c, x, y, s, face, o = {}) {
  const ox = 10 * s, oy = 12 * s, w = 32 * s, h = 38 * s;
  tg.clearRect(0, 0, w, h);
  const old = g; g = tg; drawChar(c, ox, oy, s, face, o); g = old;
  sg.globalCompositeOperation = 'source-over'; sg.clearRect(0, 0, w, h); sg.drawImage(tmpC, 0, 0);
  sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#0b0b12'; sg.fillRect(0, 0, w, h);
  sg.globalCompositeOperation = 'source-over';
  const X = Math.round(x) - ox, Y = Math.round(y) - oy;
  for (const [a, b] of [[-1,0],[1,0],[0,-1],[0,1]]) g.drawImage(silC, 0, 0, w, h, X + a, Y + b, w, h);
  g.drawImage(tmpC, 0, 0, w, h, X, Y, w, h);
  if (o.flash) {
    sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#ffffff'; sg.fillRect(0, 0, w, h);
    sg.globalCompositeOperation = 'source-over';
    g.drawImage(silC, 0, 0, w, h, X, Y, w, h);
  }
}

function loadScene(name, atDoor, x) {
  scene = name;
  const d = atDoor ? DOORS[atDoor] : null;
  p.x = d ? d.x - 6 : (x != null ? x : (SC[name].spawnX || 20));
  p.y = GROUND; p.vy = 0; p.onGround = true; p.jumps = 0; p.alpha = 1; p.kb = 0;
  if (d) d.open = 1;
  particles = []; shots = []; npcSay = null; boss = null;
  if (SC[name].name) banner = { text: SC[name].name, t: 2.5 };
  if (name === 'clase') pending = { t: 0.8, fn: () => carmeloTalk(true) };
  if (name === 'bar') greeted = false;
  if (name === 'director') pending = { t: 0.6, fn: directorTalk };
  if (name === 'disco' && !boss1Done) { boss = makeBoss('gorila'); pending = { t: 0.6, fn: bossIntro }; }
  if (name === 'metro' && !boss2Done) { boss = makeBoss('revisor'); pending = { t: 0.6, fn: bossIntro }; }
  if (name === 'outside') lastZone = zoneAt(p.x);
  camX = 0; updateCam();
}
function tryDoor(d) {
  const lock = d.lock && d.lock();
  if (lock) { p.say = { text: lock, t: 3 }; beep(150, 0.15, 'square', 0.04); return; }
  let to = d.to, at = d.at;
  if (d.drunk && drunk()) { to = 'director'; at = null; }
  trans = { d, phase:'open', t:0, to, at };
  if (d.kind === 'slide') beep(300, 0.35, 'triangle', 0.05, 600);
  else { beep(120, 0.12, 'square', 0.05); setTimeout(() => beep(90, 0.15, 'square', 0.04), 110); }
}
function goTo(to, at, x, after) { trans = { d:null, phase:'in', t:0, to, at, x, after }; }
function updateTrans(dt) {
  const d = trans.d;
  if (trans.phase === 'open') {
    d.open = Math.min(1, d.open + dt * 2.5);
    if (d.open >= 1) trans.phase = 'walk';
  } else if (trans.phase === 'walk') {
    const tx = d.x - 6, dx = tx - p.x;
    if (Math.abs(dx) < 1) { p.x = tx; trans.phase = 'in'; trans.t = 0; }
    else { p.face = Math.sign(dx); p.x += Math.sign(dx) * Math.min(Math.abs(dx), 50 * dt); p.moving = true; }
  } else if (trans.phase === 'in') {
    trans.t += dt;
    if (d) p.alpha = Math.max(0, 1 - trans.t * 3);
    fade = Math.min(1, trans.t * 2.5);
    if (fade >= 1) {
      if (d) d.open = 0;
      loadScene(trans.to, trans.at, trans.x);
      if (trans.after) trans.after();
      trans.phase = 'out';
    }
  } else if (trans.phase === 'out') {
    fade -= dt * 2.5;
    if (fade <= 0) { fade = 0; trans = null; }
  }
}

function bossBox(b) { return { x:b.x + 4, y:b.y - 40, w:16, h:40 }; }

}
function hurt(fromX) {

function updatePlayer(dt, locked) {
  const solids = SOLIDS[scene];
  let mv = 0;
  if (!locked) { if (keys.ArrowLeft) mv -= 1; if (keys.ArrowRight) mv += 1; }
  if (mv) p.face = mv;
  let vx = mv * 75 + p.kb;
  if (drunkAmt > 0 && !locked) vx += Math.sin(time * 2.1) * 32 * drunkAmt + Math.sin(time * 5.3) * 10 * drunkAmt;
  p.kb -= p.kb * Math.min(1, dt * 6);
  // eje X
  p.x += vx * dt;
  p.x = clamp(p.x, scene === 'outside' ? 0 : 4, SC[scene].w - 16);
  let b = pbox();
  for (const s of solids) if (!s.plat && overlap(b, s)) {
    if (vx > 0) p.x = s.x - 10; else if (vx < 0) p.x = s.x + s.w - 2;
    b = pbox();
  }
  // eje Y

  const wasAir = !p.onGround;
  p.vy += 620 * dt;
  p.y += p.vy * dt;
  let landed = false;
  if (p.y >= GROUND) { p.y = GROUND; landed = true; }
  for (const s of solids) {
    if (s.plat) {
      if (p.vy >= 0 && p.prevFeet <= s.y + 0.5 && p.y >= s.y && p.x + 2 < s.x + s.w && p.x + 10 > s.x) { p.y = s.y; landed = true; }
    } else if (overlap(pbox(), s)) {
      if (p.vy >= 0 && p.prevFeet <= s.y + 0.5) { p.y = s.y; landed = true; }
      else if (p.vy < 0) { p.y = s.y + s.h + 20; p.vy = 0; }
    }
  }
  if (landed) {
    p.vy = 0; p.onGround = true; p.jumps = 0;
    if (wasAir) for (let i = 0; i < 4; i++) particles.push({ x:p.x + 6, y:p.y, vx:(i - 1.5) * 20, vy:-10, life:0.25, col:'#d8d8d8' });
  } else p.onGround = false;

}
function updateCam() { camX = Math.round(clamp(p.x + 6 - W / 2, 0, SC[scene].w - W)); }
function zoneAt(x) { let z = 0; ZONES.forEach(([zx], i) => { if (x >= zx) z = i; }); return z; }

function enemyBox(e) { return e.type === 'paloma' ? { x:e.x, y:GROUND - 7, w:9, h:7 } : { x:e.x, y:GROUND - 24, w:14, h:24 }; }
function updateEnemies(dt) {
  for (const e of ENEMIES[scene] || []) {
    if (e.gone > 0) { e.gone -= dt; if (e.gone <= 0) { e.x = e.home; e.fly = 0; } continue; }
    if (e.fly > 0) { e.fly -= dt; if (e.fly <= 0) e.gone = 12; continue; }
    if (e.stop > 0) { e.stop -= dt; continue; }
    e.x += e.vx * dt;
    if (e.x < e.min) { e.x = e.min; e.vx = Math.abs(e.vx); }
    if (e.x > e.max) { e.x = e.max; e.vx = -Math.abs(e.vx); }
    const eb = enemyBox(e);
    if (overlap(pbox(), eb) && !trans) {
      if (p.vy > 0 && p.prevFeet <= eb.y + 4) {
        p.vy = -200; p.jumps = 1; p.lastJump = performance.now();
        if (e.type === 'paloma') { e.fly = 1.2; beep(900, 0.1, 'square', 0.04, 1400); }
        else { e.stop = 2.5; beep(300, 0.15, 'square', 0.05, 120); floaters.push({ x:e.x + 7, y:eb.y - 6, text:'¡EH!', col:'#fff', t:1 }); }
      } else hurt(eb.x + eb.w / 2);

  }
}
function updatePickups() {

function nearest() {
  if (!p.onGround || trans || dialog || shop || logOpen || victory) return null;
  let best = null, bd = 1e9;
  for (const it of interactables()) { const d = Math.abs(p.x + 6 - it.x); if (d < it.r && d < bd) { best = it; bd = d; } }
  return best;
}

// ============================================================
//  UPDATE
// ============================================================
function update(dt) {
  time += dt;
  if (mode === 'menu') { tickAnim(menuAnim, dt); return; }
  if (victory) { victory.t += dt; return; }

  tickAnim(p, dt);
  if (dialog) {
    const len = norm(dialog.text).length;
    const before = Math.floor(dialog.shown);
    dialog.shown = Math.min(len, dialog.shown + dt * 45);
    dialog.t += dt;
    if (Math.floor(dialog.shown) !== before && before % 3 === 0 && dialog.shown < len)
      beep(dialog.npc === 'carmelo' || dialog.npc === 'director' ? 220 : 520, 0.03, 'square', 0.02);
  }
  const paused = !!(dialog || shop || logOpen);
  if (!paused) {
    updatePlayer(dt, !!trans);
    updateEnemies(dt);
    updateBoss(dt);
    updateShots(dt);
    if (!trans) updatePickups();
    if (p.inv > 0) p.inv -= dt;
  }
  if (trans) updateTrans(dt);
  for (const k in DOORS) if (!trans || DOORS[k] !== trans.d) DOORS[k].open = Math.max(0, DOORS[k].open - dt * 1.5);

  if (pending) { pending.t -= dt; if (pending.t <= 0 && !trans) { const f = pending.fn; pending = null; f(); } }
  if (npcSay) { npcSay.t -= dt; if (npcSay.t <= 0) npcSay = null; }
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (shake > 0) shake -= dt;
  if (hintT > 0) hintT -= dt;

  // alcohol: baja 1 unidad cada 40 s
  if (alcohol > 0) alcohol = Math.max(0, alcohol - dt / 40);
  const target = drunk() ? Math.min(1, 0.55 + (alcohol - 4) * 0.15) : 0;
  drunkAmt += (target - drunkAmt) * Math.min(1, dt * 1.5);
  if (drunkAmt < 0.01) drunkAmt = 0;
  if (drunk() && !paused) {
    p.hicT -= dt;
    if (p.hicT <= 0) {
      p.hicT = 3 + Math.random() * 4;
      if (!p.say) p.say = { text:'¡HIP!', t:0.9 };
      if (p.onGround) { p.vy = -90; p.onGround = false; }
      beep(500, 0.08, 'triangle', 0.05, 900);
    }
  }

  if (scene === 'outside' && !trans) {
    const z = zoneAt(p.x);
    if (z !== lastZone) { lastZone = z; banner = { text: ZONES[z][1], t:2.2 }; }
  }
  if (scene === 'bar' && cur().id === 'lucas' && !greeted && !trans && p.x + 6 > 150) {
    greeted = true;
    npcSay = { text:'¡QUE TAL LUCAS VASQUES!', t:3 };
    speak('¡Qué tal Lucas Vasques!', 1, 1.05);
  }
  for (const q of particles) { q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt; }
  particles = particles.filter(q => q.life > 0);
  for (const f of floaters) { f.y -= 18 * dt; f.t -= dt; }
  floaters = floaters.filter(f => f.t > 0);
  updateCam();
}

function F(x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x - OX), Math.round(y), w, h); }

  const y = Math.max(2, Math.round(tipY - h - 3));

  g.fillStyle = bd; g.fillRect(x - 1, y, w + 2, h); g.fillRect(x, y - 1, w, h + 2);
  g.fillStyle = bg; g.fillRect(x, y, w, h);
  const tx = Math.round(Math.max(x + 3, Math.min(x + w - 4, cx)));
  g.fillStyle = bd; g.fillRect(tx - 2, y + h, 5, 1); g.fillRect(tx - 1, y + h + 1, 3, 1); g.fillRect(tx, y + h + 2, 1, 1);
  g.fillStyle = bg; g.fillRect(tx - 1, y + h - 1, 3, 1); g.fillRect(tx - 1, y + h, 3, 1); g.fillRect(tx, y + h + 1, 1, 1);
  lines.forEach((l, i) => txt(l, x + (w - tw(l)) / 2, y + 3 + i * 7, fg));
}

function drawDoor(d) {
  const top = GROUND - d.h, x0 = d.x - d.w / 2;
  if (d.kind === 'slide') {
    F(x0 - 2, top - 2, d.w + 4, d.h + 2, '#2b2f33'); F(x0, top, d.w, d.h, '#13202c');
    if (d.open > 0) F(x0, top, d.w, d.h, `rgba(255,240,200,${(0.35 * d.open).toFixed(2)})`);
    g.save(); g.beginPath(); g.rect(Math.round(x0 - OX), top, d.w, d.h); g.clip();
    const pw = d.w / 2, off = Math.round(d.open * (pw - 1));
    for (const px of [x0 - off, x0 + pw + off]) {
      F(px, top, pw, d.h, '#7fc8e8'); F(px, top, pw, 1, '#c9ecf8'); F(px + 2, top + 3, 1, 12, '#e8f8ff'); F(px + 4, top + 3, 1, 6, '#e8f8ff');
      F(px, top, 1, d.h, '#3d6f86'); F(px + pw - 1, top, 1, d.h, '#3d6f86'); F(px + pw / 2 - 1, top + 14, 2, 4, '#5d6168');
    }

  keys[e.key] = true;
  if (e.repeat) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

  if (k === 'm') { muted = !muted; if (muted && window.speechSynthesis) speechSynthesis.cancel(); return; }
  if (mode === 'menu') {
    if (k === 'ArrowRight') setSel(sel + 1);
    else if (k === 'ArrowLeft') setSel(sel - 1);
    else if (k === 'ArrowDown' || k === 'ArrowUp') setSel(sel + 5);
    else if (k === 'Enter' || k === ' ') startGame();
    else if (k === 'Escape' && started) mode = 'game';
    return;
  }
  if (victory) { if (k === 'e' || k === 'Enter' || k === ' ') { if (victory.t > 1) victory = null; } return; }
  if (dialog) {
    if (k === 'e' || k === 'Enter' || k === ' ') {
      const len = norm(dialog.text).length;
      if (dialog.shown < len) dialog.shown = len;
      else { const cb = dialog.onClose; dialog = null; if (cb) cb(); }
    }
    return;
  }
  if (shop) {
    const n = shopOptions().length;
    if (k === 'ArrowUp') { shop.sel = (shop.sel + n - 1) % n; beep(600, 0.03); }
    else if (k === 'ArrowDown') { shop.sel = (shop.sel + 1) % n; beep(600, 0.03); }
    else if (k === 'e' || k === 'Enter' || k === ' ') shopChoose();
    else if (k === 'Escape') shop = null;
    else if (k === 'q') { shop = null; drink(); }
    return;
  }
  if (k === 'l' || k === 'Tab') { logOpen = !logOpen; beep(700, 0.04); return; }
  if (logOpen) { if (k === 'Escape') logOpen = false; return; }
  if (k === 'Escape') { openMenu(); return; }
  if (trans) return;
  if (k === ' ') jump();
  else if (k === 'e') { const it = nearest(); if (it) it.act(); }
  else if (k === 'q') drink();
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
cv.addEventListener('click', e => {
  ac();
  if (mode !== 'menu') return;
  const b = cv.getBoundingClientRect();
  const mx = (e.clientX - b.left) / b.width * W, my = (e.clientY - b.top) / b.height * H;
  CHARS.forEach((c, i) => {
    const r = cardRect(i);
    if (mx >= r.x && mx < r.x + r.w && my >= r.y && my < r.y + r.h) { if (i === sel) startGame(); else setSel(i); }
  });
});

// ============================================================
//  BUCLE PRINCIPAL
// ============================================================
setSel(0, false);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
